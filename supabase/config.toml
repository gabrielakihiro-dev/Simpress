# Disposable local development only. No remote project is linked.
project_id = "simpress-dev"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
major_version = 17
health_timeout = "2m"

[db.pooler]
enabled = false

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = false

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.s3_protocol]
enabled = false

[storage.analytics]
enabled = false

[storage.vector]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:8000"
additional_redirect_urls = []
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false
enable_refresh_token_rotation = true
jwt_expiry = 3600
minimum_password_length = 12

[auth.email]
# CLI maps this field to the email/password PROVIDER. Public signup remains
# disabled globally by [auth].enable_signup=false (GOTRUE_DISABLE_SIGNUP).
enable_signup = true
enable_confirmations = true
secure_password_change = true

[auth.sms]
enable_signup = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
