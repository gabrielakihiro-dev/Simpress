name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

# Uma nova execução do mesmo PR cancela a anterior; no push, cada commit tem a própria execução.
concurrency:
  # push na main: um grupo por commit, então nenhum merge fica sem a própria CI
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Os testes Python levavam ~12 min num job só; divididos em 4 partes que rodam em paralelo.
  verify-shard:
    name: verify (${{ matrix.python-version }}, parte ${{ matrix.shard }}/4)
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install interface asset dependencies
        run: npm ci
      - name: Run project verification (tests, syntax, types and credentials)
        # Mesma verificação de `npm run verify`; a lista de checagens fica em scripts/verify.cjs.
        run: node scripts/verify.cjs
        env:
          PYTHON: python
          SIMPRESS_TEST_SHARD: ${{ matrix.shard }}/4
      - name: Audit JavaScript dependencies
        run: node scripts/npm-audit.cjs
      - name: Rebuild local interface assets
        run: npm run build:ui
      - name: Verify rebuilt interface assets match the commit
        shell: pwsh
        run: |
          git diff --exit-code -- static/vendor static/dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $untracked = git ls-files --others --exclude-standard -- static/vendor static/dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($untracked) {
            Write-Error "Rebuilt interface assets contain untracked files: $untracked"
            exit 1
          }

  # Mantém um check único chamado verify, que só passa se todas as partes passarem.
  verify:
    needs: verify-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every part to pass
        run: test "${{ needs.verify-shard.result }}" = "success"
