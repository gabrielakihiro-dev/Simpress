name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

# Uma nova execução da mesma branch ou PR cancela a anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt httpx==0.28.1 mypy==2.4.0
      - name: Run isolated Python tests
        run: python -B tests/run_tests.py
      - name: Run browser workflow tests
        run: node --test tests/frontend/test_transfer_workflows.cjs tests/frontend/test_inventory_ui_flows.cjs tests/frontend/test_history_annotation_retries.cjs tests/frontend/test_history_annotations.cjs tests/frontend/test_annotation_version_ui.cjs tests/frontend/test_form_draft_guard.cjs tests/frontend/test_catalog_search_utils.cjs tests/frontend/test_ui_motion.cjs tests/frontend/test_dom_utils.cjs tests/frontend/test_lucide_subset.cjs tests/frontend/test_action_dispatcher.cjs tests/frontend/test_feature_modules.cjs tests/frontend/test_data_panels.cjs tests/frontend/test_ux_enhancements.cjs
      - name: Check JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/js/shared/history-format.js
          node --check static/js/features/app-shell.js
          node --check static/js/features/dashboard.js
          node --check static/js/features/regional-contacts.js
          node --check static/js/features/transfer-form.js
          node --check static/js/features/equipment-search.js
          node --check static/js/features/units-catalog.js
          node --check static/js/features/inventory-upload.js
          node --check static/js/features/comparison-result.js
          node --check static/js/features/comparison-history.js
          node --check static/js/features/ticket-rules.js
          node --check static/js/features/ticket-tracking.js
          node --check static/js/features/equipment-editor.js
          node --check static/js/features/alias-history.js
          node --check static/js/shared/dom-utils.js
          node --check static/js/ui/accessible-dialogs.js
          node --check static/js/shared/transfer-utils.js
          node --check static/js/shared/history-annotation-autosave.js
          node --check static/js/shared/form-draft-guard.js
          node --check static/js/shared/catalog-search-utils.js
          node --check static/js/ui/ui-motion.js
          node --check static/js/ui/ui-notifications.js
          node --check static/js/ui/sidebar-navigation.js
          node --check static/js/ui/action-dispatcher.js
          node --check playwright.config.cjs
          node --check tests/e2e/ui.spec.cjs
          node --check tests/e2e/ticket-requests.spec.cjs
          node --check config/tailwind.config.cjs
          node --check scripts/build/copy_ui_assets.cjs
          node --check scripts/build/lucide-subset.cjs
      - name: Check Python syntax
        run: python -m compileall -q core/config.py main.py core/integrity.py core/openpyxl_compat.py core/xlsx_safety.py core/logging_setup.py domains routers security scripts tests/support/serve_ui_motion_preview.py
      - name: Run gradual static type checks
        run: python -m mypy --explicit-package-bases --platform win32 --ignore-missing-imports --check-untyped-defs core/config.py main.py core/integrity.py core/logging_setup.py core/openpyxl_compat.py core/xlsx_safety.py domains/history_export.py domains/history_restore.py domains/inventory_comparison.py domains/inventory_update.py domains/equipment_search.py domains/effective_alias.py domains/uploaded_workbooks.py domains/readiness.py routers/inventory_history.py routers/transfers.py routers/equipment_search.py routers/system.py routers/units.py core/inventory_requests.py security scripts/migrate_local_data.py scripts/cleanup_local_temps.py
      - name: Check tracked files for common credentials
        run: python -B scripts/check_secrets.py
      - name: Install interface asset dependencies
        run: npm ci
      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=moderate
      - name: Rebuild local interface assets
        run: npm run build:ui
