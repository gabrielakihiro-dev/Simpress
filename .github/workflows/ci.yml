name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt mypy==2.4.0
      - name: Run isolated Python tests
        run: python -B tests/run_tests.py
      - name: Run browser workflow tests
        run: node --test tests/test_transfer_workflows.cjs tests/test_inventory_ui_flows.cjs
      - name: Check JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/transfer-utils.js
          node --check tailwind.config.cjs
          node --check scripts/copy_ui_assets.cjs
      - name: Check Python syntax
        run: python -m compileall -q app_config.py main.py integrity.py openpyxl_compat.py xlsx_safety.py domains routers scripts
      - name: Run gradual static type checks
        run: python -m mypy --platform win32 --ignore-missing-imports --check-untyped-defs app_config.py main.py integrity.py openpyxl_compat.py xlsx_safety.py domains/inventory_comparison.py domains/inventory_update.py routers/inventory_history.py routers/transfers.py
      - name: Check tracked files for common credentials
        run: python -B scripts/check_secrets.py
      - name: Rebuild local interface assets
        run: |
          npm ci
          npm run build:ui
