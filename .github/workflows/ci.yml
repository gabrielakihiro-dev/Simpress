name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

# Uma nova execução da mesma branch ou PR cancela a anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install interface asset dependencies
        run: npm ci
      - name: Run project verification (tests, syntax, types and credentials)
        # Mesma verificação de `npm run verify`; a lista de checagens fica em scripts/verify.cjs.
        run: node scripts/verify.cjs
        env:
          PYTHON: python
      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=moderate
      - name: Rebuild local interface assets
        run: npm run build:ui
      - name: Verify rebuilt interface assets match the commit
        shell: pwsh
        run: |
          git diff --exit-code -- static/vendor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $untracked = git ls-files --others --exclude-standard -- static/vendor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($untracked) {
            Write-Error "Rebuilt interface assets contain untracked files: $untracked"
            exit 1
          }
