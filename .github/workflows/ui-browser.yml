name: UI browser

# Playwright é o job mais pesado: roda só quando algo que a interface usa muda.
on:
  push:
    branches: [main]
    paths:
      - "static/**"
      - "frontend/**"
      - "vite.config.mts"
      - "tsconfig*.json"
      - "tests/e2e/**"
      - "tests/support/**"
      - "playwright.config.cjs"
      - "package.json"
      - "package-lock.json"
      - "config/**"
      - "scripts/build/**"
      - "domains/**"
      - "routers/**"
      - "core/**"
      - "requirements*.txt"
      - ".github/workflows/ui-browser.yml"
  pull_request:
    paths:
      - "static/**"
      - "frontend/**"
      - "vite.config.mts"
      - "tsconfig*.json"
      - "tests/e2e/**"
      - "tests/support/**"
      - "playwright.config.cjs"
      - "package.json"
      - "package-lock.json"
      - "config/**"
      - "scripts/build/**"
      - "domains/**"
      - "routers/**"
      - "core/**"
      - "requirements*.txt"
      - ".github/workflows/ui-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # push na main: um grupo por commit, então nenhum merge fica sem a própria CI
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  # A suíte inteira levava ~30 min num job só; dividida em 8 partes que rodam em paralelo.
  ui-browser-shard:
    name: ui-browser (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: windows-latest
    # Com o shader da marca, cada parte leva 17-20 min no runner Windows; 20 cortava a suíte no meio.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 8 shards: regra do usuário, shard acima de 15 min ganha mais shards (com 5, de 14 a 27 min de teste)
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      # requirements-dev.txt traz o httpx que o TestClient da fixture da Cobertura exige.
      - name: Install Python dependencies of the UI fixture
        run: python -m pip install -r requirements-dev.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install browser test dependencies
        run: npm ci
      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=moderate
      - name: Rebuild local interface assets
        run: npm run build:ui
      - name: Verify rebuilt interface assets match the commit
        shell: pwsh
        run: |
          git diff --exit-code -- static/vendor static/dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $untracked = git ls-files --others --exclude-standard -- static/vendor static/dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($untracked) {
            Write-Error "Rebuilt interface assets contain untracked files: $untracked"
            exit 1
          }
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Test real interface in desktop and mobile viewports
        run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  # Mantém um check único chamado ui-browser, que só passa se todas as partes passarem.
  ui-browser:
    needs: ui-browser-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every shard to pass
        run: test "${{ needs.ui-browser-shard.result }}" = "success"
