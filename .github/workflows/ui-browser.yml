name: UI browser

# Playwright é o job mais pesado: roda só quando algo que a interface usa muda.
on:
  push:
    branches: [main]
    paths:
      - "static/**"
      - "frontend/**"
      - "vite.config.mts"
      - "tsconfig*.json"
      - "tests/e2e/**"
      - "tests/support/**"
      - "playwright.config.cjs"
      - "package.json"
      - "package-lock.json"
      - "config/**"
      - "scripts/build/**"
      - "domains/**"
      - "routers/**"
      - "core/**"
      - "requirements*.txt"
      - ".github/workflows/ui-browser.yml"
  pull_request:
    paths:
      - "static/**"
      - "frontend/**"
      - "vite.config.mts"
      - "tsconfig*.json"
      - "tests/e2e/**"
      - "tests/support/**"
      - "playwright.config.cjs"
      - "package.json"
      - "package-lock.json"
      - "config/**"
      - "scripts/build/**"
      - "domains/**"
      - "routers/**"
      - "core/**"
      - "requirements*.txt"
      - ".github/workflows/ui-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # push na main: um grupo por commit, então nenhum merge fica sem a própria CI
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  # A suíte inteira levava ~30 min num job só; dividida em 10 partes que rodam em paralelo.
  # Cada parte roda uma lista fixa de specs (matrix.specs), não `--shard`: com fullyParallel desligado o
  # Playwright reparte por arquivo e sai desigual (de 3 a 16 min por parte). O teste
  # tests/frontend/test_ui_browser_shards.cjs falha se um spec novo ficar fora das listas ou repetido.
  ui-browser-shard:
    name: ui-browser (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: windows-latest
    # Teto fixo do usuário: não sobe. Cada parte mira menos de 15 min; acima disso, divida os grupos.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 10 partes de ~11 min de teste (~12,4 min de job, com ~1,4 min de preparo); limite do usuário: 15 min.
        # Com 8 partes a soma (~110 min) dava ~15 por parte: o run 43809541042 de 16/11/2026 teve job 6 com 17,5 min.
        # Divisão pelo tempo de relógio de cada spec nesse run (desktop + mobile; react-g10 estimado em ~2 min):
        # previsão de job 1 ~12,4 · 2 ~12,3 · 3 ~12,5 · 4 ~12,7 · 5 ~12,3 · 6 ~13,5 · 7 ~12,4 · 8 ~12,3 · 9 ~12,6 · 10 ~12,4.
        # react-g7b.spec.cjs (G7b, ~1,3 min local) entrou no 6, o menor (~12,2 antes dele).
        # react-g9.spec.cjs (G9, ~1 min local) entrou no 1, o menor no run 43819394801 do G10 (8,4 min).
        # Spec novo: some-o ao grupo de menor soma e reconfira os tempos na CI; o teste avisa se faltar.
        # react-bf1.spec.cjs foi adicionado ao shard 2, um dos menores pela última medição de relógio.
        # react-bf2.spec.cjs (BF2, ~0,8 min local) foi adicionado ao shard 5, um dos menores (~12,3) sem spec novo recente.
        # BF3 (run 43940572955 da main): o shard 6 passou de 15 min (15m17), então react-g7b.spec.cjs foi
        # para o 8 (8m58); react-bf3.spec.cjs (~2,3 min local, desktop + mobile) entrou no 9, um dos menores
        # no run 43962071291 (9,7 min), para não somar com o react-bf2 no 5.
        # react-bf4.spec.cjs (BF4, desktop + mobile) entrou no 1, o menor no run 44006280253 da main (7m57; o 10 teve 8m08).
        # react-final-c.spec.cjs (React final C, desktop + mobile, 10 testes) entrou no 10, o segundo menor nesse run; reconfira na CI.
        include:
          - shard: 1
            specs: >-
              assistente.spec.cjs resumo-os.spec.cjs regional-representative.spec.cjs react-g9.spec.cjs
              react-bf4.spec.cjs
          - shard: 2
            specs: >-
              backups-regionais.spec.cjs react-g5.spec.cjs react-g6.spec.cjs alias-history.spec.cjs
              theme-toggle.spec.cjs react-bf1.spec.cjs
          - shard: 3
            specs: >-
              cockpit-layout.spec.cjs dossie-equipamento.spec.cjs info-tips-ferramentas.spec.cjs
              react-g3.spec.cjs
          - shard: 4
            specs: >-
              cockpit-tools.spec.cjs react-g4.spec.cjs outlook-email.spec.cjs configuracao-local.spec.cjs
          - shard: 5
            specs: >-
              info-tips-todos.spec.cjs react-piloto.spec.cjs color-contrast.spec.cjs
              endpoint-lookup.spec.cjs asset-updates.spec.cjs react-bf2.spec.cjs
          - shard: 6
            specs: >-
              lembretes.spec.cjs chrome-automation.spec.cjs react-g1.spec.cjs origin-contact.spec.cjs
              react-infra.spec.cjs
          - shard: 7
            specs: >-
              monthly-report.spec.cjs cobertura.spec.cjs react-g10.spec.cjs chamados-os.spec.cjs
              ux-chamados.spec.cjs
          - shard: 8
            specs: >-
              react-g7.spec.cjs termos.spec.cjs os-subabas.spec.cjs react-g8.spec.cjs
              ticket-requests.spec.cjs react-g7b.spec.cjs
          - shard: 9
            specs: >-
              sebrae-dashboard.spec.cjs info-tips-resumo.spec.cjs react-bf3.spec.cjs
          - shard: 10
            specs: >-
              ui.spec.cjs react-g2.spec.cjs ux-ticket.spec.cjs first-access.spec.cjs react-final-c.spec.cjs
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      # requirements-dev.txt traz o httpx que o TestClient da fixture da Cobertura exige.
      - name: Install Python dependencies of the UI fixture
        run: python -m pip install -r requirements-dev.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install browser test dependencies
        run: npm ci
      - name: Audit JavaScript dependencies
        run: node scripts/npm-audit.cjs
      - name: Rebuild local interface assets
        run: npm run build:ui
      - name: Verify rebuilt interface assets match the commit
        shell: pwsh
        run: |
          git diff --exit-code -- static/vendor static/dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $untracked = git ls-files --others --exclude-standard -- static/vendor static/dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($untracked) {
            Write-Error "Rebuilt interface assets contain untracked files: $untracked"
            exit 1
          }
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Test real interface in desktop and mobile viewports
        run: npx playwright test ${{ matrix.specs }}

  # Mantém um check único chamado ui-browser, que só passa se todas as partes passarem.
  ui-browser:
    needs: ui-browser-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every shard to pass
        run: test "${{ needs.ui-browser-shard.result }}" = "success"
