name: UI browser

# Playwright é o job mais pesado: roda só quando algo que a interface usa muda.
on:
  push:
    branches: [main]
    paths:
      - "static/**"
      - "frontend/**"
      - "vite.config.mts"
      - "tsconfig*.json"
      - "tests/e2e/**"
      - "tests/support/**"
      - "playwright.config.cjs"
      - "package.json"
      - "package-lock.json"
      - "config/**"
      - "scripts/build/**"
      - "domains/**"
      - "routers/**"
      - "core/**"
      - "requirements*.txt"
      - ".github/workflows/ui-browser.yml"
  pull_request:
    paths:
      - "static/**"
      - "frontend/**"
      - "vite.config.mts"
      - "tsconfig*.json"
      - "tests/e2e/**"
      - "tests/support/**"
      - "playwright.config.cjs"
      - "package.json"
      - "package-lock.json"
      - "config/**"
      - "scripts/build/**"
      - "domains/**"
      - "routers/**"
      - "core/**"
      - "requirements*.txt"
      - ".github/workflows/ui-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # push na main: um grupo por commit, então nenhum merge fica sem a própria CI
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  # A suíte inteira levava ~30 min num job só; dividida em 8 partes que rodam em paralelo.
  # Cada parte roda uma lista fixa de specs (matrix.specs), não `--shard`: com fullyParallel desligado o
  # Playwright reparte por arquivo e sai desigual (de 3 a 16 min por parte). O teste
  # tests/frontend/test_ui_browser_shards.cjs falha se um spec novo ficar fora das listas ou repetido.
  ui-browser-shard:
    name: ui-browser (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: windows-latest
    # Teto fixo do usuário: não sobe. Cada parte mira menos de 15 min; acima disso, divida os grupos.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 8 partes de ~11,5 min de teste (~13 min de job, com ~1,5 min de preparo); limite do usuário: 15 min.
        # Soma por arquivo (desktop + mobile) medida em 4 execuções verdes de 15/11/2026: pior parte, 12 min.
        # Spec novo: some-o ao grupo de menor soma e reconfira os tempos na CI; o teste avisa se faltar.
        include:
          - shard: 1
            specs: >-
              monthly-report.spec.cjs backups-regionais.spec.cjs react-piloto.spec.cjs
              react-g1.spec.cjs react-g3.spec.cjs endpoint-lookup.spec.cjs
          - shard: 2
            specs: >-
              lembretes.spec.cjs cobertura.spec.cjs chamados-os.spec.cjs
              info-tips-ferramentas.spec.cjs react-infra.spec.cjs
          - shard: 3
            specs: >-
              cockpit-layout.spec.cjs react-g2.spec.cjs dossie-equipamento.spec.cjs
              outlook-email.spec.cjs first-access.spec.cjs ticket-requests.spec.cjs
          - shard: 4
            specs: >-
              info-tips-todos.spec.cjs react-g6.spec.cjs chrome-automation.spec.cjs
              theme-toggle.spec.cjs asset-updates.spec.cjs
          - shard: 5
            specs: >-
              cockpit-tools.spec.cjs termos.spec.cjs ux-ticket.spec.cjs
              regional-representative.spec.cjs configuracao-local.spec.cjs origin-contact.spec.cjs
          - shard: 6
            specs: >-
              assistente.spec.cjs react-g5.spec.cjs os-subabas.spec.cjs
          - shard: 7
            specs: >-
              ui.spec.cjs react-g4.spec.cjs resumo-os.spec.cjs alias-history.spec.cjs
              ux-chamados.spec.cjs
          - shard: 8
            specs: >-
              sebrae-dashboard.spec.cjs color-contrast.spec.cjs info-tips-resumo.spec.cjs
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      # requirements-dev.txt traz o httpx que o TestClient da fixture da Cobertura exige.
      - name: Install Python dependencies of the UI fixture
        run: python -m pip install -r requirements-dev.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install browser test dependencies
        run: npm ci
      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=moderate
      - name: Rebuild local interface assets
        run: npm run build:ui
      - name: Verify rebuilt interface assets match the commit
        shell: pwsh
        run: |
          git diff --exit-code -- static/vendor static/dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $untracked = git ls-files --others --exclude-standard -- static/vendor static/dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($untracked) {
            Write-Error "Rebuilt interface assets contain untracked files: $untracked"
            exit 1
          }
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Test real interface in desktop and mobile viewports
        run: npx playwright test ${{ matrix.specs }}

  # Mantém um check único chamado ui-browser, que só passa se todas as partes passarem.
  ui-browser:
    needs: ui-browser-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every shard to pass
        run: test "${{ needs.ui-browser-shard.result }}" = "success"
