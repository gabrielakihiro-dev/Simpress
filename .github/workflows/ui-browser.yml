name: UI browser

# Playwright é o job mais pesado: roda só quando algo que a interface usa muda.
on:
  push:
    branches: [main]
    paths:
      - "static/**"
      - "tests/e2e/**"
      - "tests/support/**"
      - "playwright.config.cjs"
      - "package.json"
      - "package-lock.json"
      - "config/**"
      - "scripts/build/**"
      - "domains/**"
      - "routers/**"
      - "core/**"
      - "requirements*.txt"
      - ".github/workflows/ui-browser.yml"
  pull_request:
    paths:
      - "static/**"
      - "tests/e2e/**"
      - "tests/support/**"
      - "playwright.config.cjs"
      - "package.json"
      - "package-lock.json"
      - "config/**"
      - "scripts/build/**"
      - "domains/**"
      - "routers/**"
      - "core/**"
      - "requirements*.txt"
      - ".github/workflows/ui-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-browser:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      # requirements-dev.txt traz o httpx que o TestClient da fixture da Cobertura exige.
      - name: Install Python dependencies of the UI fixture
        run: python -m pip install -r requirements-dev.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install browser test dependencies
        run: npm ci
      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=moderate
      - name: Rebuild local interface assets
        run: npm run build:ui
      - name: Verify rebuilt interface assets match the commit
        shell: pwsh
        run: |
          git diff --exit-code -- static/vendor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $untracked = git ls-files --others --exclude-standard -- static/vendor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($untracked) {
            Write-Error "Rebuilt interface assets contain untracked files: $untracked"
            exit 1
          }
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Test real interface in desktop and mobile viewports
        run: npm run test:ui:e2e
