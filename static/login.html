<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acesso • Simpress</title><link rel="icon" href="/static/favicon.svg"><link rel="stylesheet" href="/static/login.css"></head>
<body><main><h1>Simpress</h1><p>Entre com a conta administradora desta instalação.</p>
<form id="login-form"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="username" maxlength="254" required>
<label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="1024" required>
<button id="submit" type="submit">Entrar</button><p id="status" role="status" aria-live="polite"></p></form></main>
<script src="/static/auth-session.js"></script><script src="/static/login.js"></script></body></html>
